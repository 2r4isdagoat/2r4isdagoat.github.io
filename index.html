
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Search Portal</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b1020;
      color: #f5f7ff;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(650px, 92%);
      text-align: center;
    }

    h1 {
      font-size: clamp(42px, 9vw, 68px);
      letter-spacing: -3px;
      margin-bottom: 8px;
    }

    h1 span { color: #91a7ff; }

    p { color: #9aa8c4; }

    form {
      display: flex;
      gap: 10px;
      margin: 28px 0;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border: 1px solid #35415d;
      border-radius: 12px;
      background: #171f33;
      color: white;
      font-size: 16px;
    }

    button {
      padding: 14px 20px;
      border: 0;
      border-radius: 12px;
      background: #91a7ff;
      color: #0b1020;
      font-weight: 700;
      cursor: pointer;
    }

    .links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    a {
      color: #cbd5ff;
      text-decoration: none;
    }

    .links a {
      padding: 10px 14px;
      border: 1px solid #35415d;
      border-radius: 10px;
    }

    footer {
      margin-top: 40px;
      color: #8390aa;
      font-size: 12px;
    }

    @media (max-width: 440px) {
      form { flex-direction: column; }
    }
  </style>
</head>

<body>
  <main>
    <h1>search<span>.</span></h1>
    <p>Your personal web search portal.</p>

    <form id="searchForm">
      <input
        id="query"
        name="q"
        type="search"
        placeholder="Search the web..."
        maxlength="300"
        aria-label="Search the web"
        required
        autofocus
      >
      <button type="submit">Search</button>
    </form>

    <div class="links">
      <a href="https://duckduckgo.com/">DuckDuckGo</a>
      <a href="https://wikipedia.org/">Wikipedia</a>
      <a href="https://github.com/">GitHub</a>
    </div>

    <footer>
      Personal search portal
    </footer>
  </main>

  <script>
    // Replace this with your actual Cloudflare Worker URL.
    const WORKER_URL = ddg-portal.xanderisthemanxbox.workers.dev;

    document.getElementById("searchForm").addEventListener(
      "submit",
      function (event) {
        event.preventDefault();

        const query = document
          .getElementById("query")
          .value.trim();

        if (!query || query.length > 300) return;

        const destination = new URL("/search", WORKER_URL);
        destination.searchParams.set("q", query);

        window.location.href = destination.href;
      }
    );
  </script>
</body>
</html>
