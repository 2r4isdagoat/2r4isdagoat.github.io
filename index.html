
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10141d">
  <title>My Search</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #10141d;
      --panel: #191f2b;
      --border: #30394b;
      --text: #f2f5fa;
      --muted: #a6b0c2;
      --accent: #78a9ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }

    .container {
      width: min(850px, 92%);
      margin: auto;
      padding: 65px 0 45px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(38px, 7vw, 58px);
      letter-spacing: -2px;
    }

    .subtitle, footer { color: var(--muted); }

    form {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      font-size: 16px;
    }

    input:focus { outline: 2px solid var(--accent); }

    button {
      padding: 14px 22px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #10141d;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }

    #status {
      margin: 18px 0;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .result {
      padding: 18px;
      margin: 14px 0;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
      overflow-wrap: anywhere;
    }

    .result h2 { margin: 0 0 8px; font-size: 20px; }
    .result h2 a { color: var(--accent); text-decoration: none; }
    .result h2 a:hover { text-decoration: underline; }
    .result p { margin: 8px 0; }
    .result-url { color: #9ac9a8; font-size: 13px; }

    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 520px) {
      .container { padding-top: 40px; }
      form { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <h1>My Search</h1>
      <p class="subtitle">
        Search for quick answers and related information.
      </p>
    </header>

    <form id="search-form">
      <input
        id="search-input"
        type="search"
        placeholder="Search the web..."
        aria-label="Search query"
        maxlength="300"
        required
      >
      <button id="search-btn" type="submit">Search</button>
    </form>

    <p id="status" role="status" aria-live="polite">
      Enter a search to get started.
    </p>

    <section id="results" aria-label="Search results"></section>

    <footer>
      Quick answers provided by DuckDuckGo's Instant Answer API.
      This is not a full web search index.
    </footer>
  </main>

  <script>
    // Your actual Cloudflare Worker URL:
    const WORKER_URL =
      "https://ddg-json-api.xanderisthemanxbox.workers.dev";

    const form = document.getElementById("search-form");
    const input = document.getElementById("search-input");
    const results = document.getElementById("results");
    const status = document.getElementById("status");
    const button = document.getElementById("search-btn");

    function addText(parent, tag, text, className) {
      const element = document.createElement(tag);
      element.textContent = text;
      if (className) element.className = className;
      parent.appendChild(element);
      return element;
    }

    function addResult(title, description, url) {
      const card = document.createElement("article");
      card.className = "result";

      if (url) {
        try {
          const parsed = new URL(url);

          if (["https:", "http:"].includes(parsed.protocol)) {
            const heading = document.createElement("h2");
            const link = document.createElement("a");
            link.href = parsed.href;
            link.textContent = title;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            heading.appendChild(link);
            card.appendChild(heading);
            addText(card, "p", parsed.hostname, "result-url");
          } else {
            addText(card, "h2", title);
          }
        } catch {
          addText(card, "h2", title);
        }
      } else {
        addText(card, "h2", title);
      }

      if (description) addText(card, "p", description);
      results.appendChild(card);
    }

    function flattenTopics(topics, output = []) {
      if (!Array.isArray(topics)) return output;

      for (const topic of topics) {
        if (topic.Text && topic.FirstURL) output.push(topic);
        if (Array.isArray(topic.Topics)) {
          flattenTopics(topic.Topics, output);
        }
      }

      return output;
    }

    function renderResults(data) {
      results.replaceChildren();
      let count = 0;

      if (data.AbstractText) {
        addResult(
          data.Heading || "Quick answer",
          data.AbstractText,
          data.AbstractURL || ""
        );
        count++;
      }

      if (data.Answer) {
        addResult("Answer", data.Answer, "");
        count++;
      }

      if (data.Definition) {
        addResult(
          data.DefinitionSource || "Definition",
          data.Definition,
          data.DefinitionURL || ""
        );
        count++;
      }

      for (const topic of flattenTopics(data.RelatedTopics || [])) {
        if (count >= 15) break;
        addResult(topic.Text, "", topic.FirstURL);
        count++;
      }

      if (count === 0) {
        addText(
          results,
          "p",
          "No instant answers were found. Try a different search."
        );
      }

      status.textContent = count
        ? `Found ${count} answer(s) or related topic(s).`
        : "No quick answers found.";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const query = input.value.trim();
      if (!query) return;

      button.disabled = true;
      button.textContent = "Searching...";
      status.textContent = "Searching...";
      results.replaceChildren();

      try {
        const endpoint = new URL(WORKER_URL);
        endpoint.searchParams.set("q", query);

        const response = await fetch(endpoint.toString());
        const body = await response.text();

        if (!response.ok) {
          throw new Error(`Worker returned HTTP ${response.status}.`);
        }

        let data;
        try {
          data = JSON.parse(body);
        } catch {
          throw new Error(
            "Worker returned HTML instead of JSON. Check the deployed Worker and URL."
          );
        }

        if (data.error) throw new Error(data.error);
        renderResults(data);
      } catch (error) {
        console.error("Search error:", error);
        status.textContent = "Could not load results: " + error.message;
      } finally {
        button.disabled = false;
        button.textContent = "Search";
      }
    });
  </script>
</body>
</html>
