<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101820;
      color: white;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(90%, 560px);
      text-align: center;
    }
    h1 { font-size: 3rem; }
    form { display: flex; gap: 8px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border-radius: 24px;
      border: 1px solid #667;
      background: #202b36;
      color: white;
      font-size: 16px;
    }
    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 24px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Search</h1>
    <form action="https://duckduckgo.com/" method="get">
      <input name="q" placeholder="Search the web..."
             aria-label="Search the web" required>
      <button type="submit">Search</button>
    </form>
    <p>Search privately with DuckDuckGo.</p>
  </main>
</body>
</html>
