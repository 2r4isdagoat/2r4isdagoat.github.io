
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d18">
  <title>Search</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #090d18;
      color: #f4f6ff;
      font-family: system-ui, Arial, sans-serif;
    }
    main {
      width: min(620px, 92%);
      text-align: center;
      padding: 32px 0;
    }
    .logo {
      font-size: clamp(42px, 10vw, 66px);
      font-weight: 750;
      letter-spacing: -3px;
      margin-bottom: 8px;
    }
    .logo span { color: #8b9dff; }
    p { color: #9ba6bd; }
    form {
      display: flex;
      gap: 10px;
      margin: 28px 0 20px;
    }
    input {
      flex: 1;
      width: 0;
      min-width: 0;
      padding: 16px 19px;
      border: 1px solid #303b53;
      border-radius: 14px;
      background: #151c2c;
      color: white;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: #8b9dff; }
    button, .shortcut {
      border: 0;
      border-radius: 12px;
      padding: 13px 18px;
      background: #8b9dff;
      color: #0b1020;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
    .links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }
    .shortcut {
      background: #151c2c;
      color: #e3e8f7;
      border: 1px solid #303b53;
      font-weight: 500;
    }
    .shortcut:hover { border-color: #8b9dff; }
    footer {
      margin-top: 48px;
      font-size: 12px;
      color: #7e899f;
    }
    @media (max-width: 440px) {
      form { flex-direction: column; }
      input { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">search<span>.</span></div>
    <p>A simple place to search the web.</p>

    <form action="https://duckduckgo.com/" method="get">
      <input
        type="search"
        name="q"
        placeholder="What are you looking for?"
        aria-label="Search the web"
        autofocus
        required
      >
      <button type="submit">Search ↗</button>
    </form>

    <div class="links">
      <a class="shortcut" href="https://duckduckgo.com/">DuckDuckGo</a>
      <a class="shortcut" href="https://wikipedia.org/">Wikipedia</a>
      <a class="shortcut" href="https://github.com/">GitHub</a>
    </div>

    <footer>
      Search powered by DuckDuckGo · Hosted on GitHub Pages
    </footer>
  </main>
</body>
</html>
